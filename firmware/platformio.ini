; Smart Price Tag · firmware (PCS3858, Poli-USP)
;
; Dois ambientes do firmware, que diferem apenas no intervalo de verificação e no nível de log:
;   prod: desperta uma vez por dia
;   demo: desperta a cada 3 min, com log mais verboso (apresentações e depuração)
; e um ambiente de teste de hardware, que não é o firmware:
;   bancada: testa visor, botão e deep sleep sem rede (src/bancada/bancada.cpp)
;
; Todas as versões são fixadas para que o build seja reproduzível em qualquer máquina.

[platformio]
; Evita que `pio run -t upload` sem `-e` grave os dois ambientes em sequência.
default_envs = demo

[env]
; 7.1.3 traz o núcleo Arduino-ESP32 2.0.17 (ESP-IDF 4.4).
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    zinggjm/GxEPD2 @ 1.6.9
    adafruit/Adafruit GFX Library @ 1.12.6
    ; Dependência transitiva do Adafruit GFX, fixada para reprodutibilidade.
    adafruit/Adafruit BusIO @ 1.17.4
    ; Fontes UTF-8 (acentos) e logisoso46 sobre o Adafruit GFX (render).
    olikraus/U8g2_for_Adafruit_GFX @ 1.8.0
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    '-DFW_VERSION="1.0.0"'
    ; include/ (board.h, spt_secrets.h) visível também para os módulos em lib/
    -I include
; Warnings extras só em src/; para checar lib/ veja "Build estrito" no README.
build_src_flags = -Wall -Wextra
; O programa de bancada tem o próprio setup(): fica fora do firmware.
build_src_filter = +<*> -<bancada/>

[env:prod]
build_flags =
    ${env.build_flags}
    -DCHECK_INTERVAL_S=86400
    ; 3 = info
    -DSPT_LOG_LEVEL=3
    ; núcleo Arduino: só erros
    -DCORE_DEBUG_LEVEL=1

[env:demo]
build_flags =
    ${env.build_flags}
    -DCHECK_INTERVAL_S=180
    ; 4 = debug
    -DSPT_LOG_LEVEL=4
    ; núcleo Arduino: até info
    -DCORE_DEBUG_LEVEL=3

[env:bancada]
; Teste de hardware sem rede: não precisa de include/secrets.h.
build_src_filter = +<bancada/>
build_flags =
    ${env.build_flags}
    ; 4 = debug (inclui os tempos internos do GxEPD2)
    -DSPT_LOG_LEVEL=4
    -DCORE_DEBUG_LEVEL=1
